services:
  # Backend Django Service
  - type: web
    name: reconocimiento-voz-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    plan: free
    env: python
    region: oregon
    rootDir: ./backend
    healthCheckPath: /admin/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DEBUG
        value: "false"
      - key: DJANGO_SETTINGS_MODULE
        value: "core.settings"
      - key: SECRET_KEY
        generateValue: true
      # SQLite configuration - leave DATABASE_URL empty to use SQLite
      - key: DATABASE_URL
        value: ""
      - key: ALLOWED_HOSTS
        value: "reconocimiento-voz-backend.onrender.com,devproyectos.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://devproyectos.com,http://localhost:3000,http://localhost:5173"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://reconocimiento-voz-backend.onrender.com,https://devproyectos.com"

  # Note: PostgreSQL database service removed since we're using SQLite
  # SQLite database file will be stored in the web service filesystem