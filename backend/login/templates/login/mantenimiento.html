<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Área de Mantenimiento</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    .user-welcome{background:#2e4a6e;border-radius:16px;padding:20px;margin-bottom:18px}
    .user-info p{margin:6px 0}
  </style>
  </head>
<body class="page">
  <div class="container">
    <div class="user-welcome">
      <h2>🔧 En Mantenimiento</h2>
      <div class="user-info">
        <p>Bienvenido, <strong>{{ user.nombres }} {{ user.apellidos }}</strong></p>
        <p>Email: {{ user.email }}</p>
        <p>DNI: {{ user.dni }}</p>
      </div>
    </div>

    <div class="maintenance-card">
      <p>Contenido restringido para usuarios autenticados facialmente.</p>
      <a class="btn primary" href="/logout/">Cerrar sesión</a>
    </div>
  </div>
</body>
</html>
