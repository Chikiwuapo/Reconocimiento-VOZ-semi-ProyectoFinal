<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:0.8"/>
    </radialGradient>
    <linearGradient id="nodeGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="nodeGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="nodeGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="60" cy="60" r="55" fill="url(#bgGradient)" stroke="#6366f1" stroke-width="1" opacity="0.8"/>
  
  <!-- Network connections -->
  <g stroke-width="2" opacity="0.7">
    <!-- Central connections -->
    <line x1="60" y1="35" x2="45" x2="55" stroke="#8b5cf6"/>
    <line x1="60" y1="35" x2="75" y2="55" stroke="#ef4444"/>
    <line x1="45" y1="55" x2="60" y2="85" stroke="#ef4444"/>
    <line x1="75" y1="55" x2="60" y2="85" stroke="#06b6d4"/>
    <line x1="45" y1="55" x2="75" y2="55" stroke="#6366f1"/>
    <line x1="60" y1="35" x2="60" y2="85" stroke="#8b5cf6" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Network nodes -->
  <g>
    <!-- Top center node (purple) -->
    <circle cx="60" cy="35" r="8" fill="url(#nodeGradient1)" stroke="#8b5cf6" stroke-width="2"/>
    
    <!-- Left node (blue) -->
    <circle cx="45" cy="55" r="7" fill="url(#nodeGradient2)" stroke="#06b6d4" stroke-width="2"/>
    
    <!-- Right node (red/orange) -->
    <circle cx="75" cy="55" r="7" fill="url(#nodeGradient3)" stroke="#ef4444" stroke-width="2"/>
    
    <!-- Bottom center node (red/orange) -->
    <circle cx="60" cy="85" r="8" fill="url(#nodeGradient3)" stroke="#ef4444" stroke-width="2"/>
    
    <!-- Additional small nodes -->
    <circle cx="35" cy="40" r="4" fill="#06b6d4" opacity="0.8"/>
    <circle cx="85" cy="40" r="4" fill="#ef4444" opacity="0.8"/>
    <circle cx="35" cy="80" r="4" fill="#8b5cf6" opacity="0.8"/>
    <circle cx="85" cy="80" r="4" fill="#06b6d4" opacity="0.8"/>
  </g>
  
  <!-- Subtle glow effects -->
  <g opacity="0.3">
    <circle cx="60" cy="35" r="12" fill="#8b5cf6" opacity="0.2"/>
    <circle cx="60" cy="85" r="12" fill="#ef4444" opacity="0.2"/>
    <circle cx="45" cy="55" r="10" fill="#06b6d4" opacity="0.2"/>
    <circle cx="75" cy="55" r="10" fill="#ef4444" opacity="0.2"/>
  </g>
</svg>